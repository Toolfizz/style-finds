name: Build Quotation Maker Android

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android-quotation-maker/**"
      - ".github/workflows/build-quotation-maker-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android-quotation-maker
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-quotation-maker/app/build/outputs/apk/debug/app-debug.apk "Quotation Maker for Photographers.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotation-Maker-for-Photographers-Android
          path: "Quotation Maker for Photographers.apk"
          if-no-files-found: error
